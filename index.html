<head>

<title>입체도형 탐구실</title>
<style>
:root { --bg:#EEF1F4; --surface:#fff; --ink:#1C2733; --muted:#5E6B78; --line:#D5DCE3; --accent:#0F7A6C; --err:#C2410C; }
@media (prefers-color-scheme: dark) { :root { --bg:#12171D; --surface:#1B2229; --ink:#E6EBF0; --muted:#97A3AF; --line:#2C3640; --accent:#3DBBA8; --err:#FB923C; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
  font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding:16px; }
form { width:100%; max-width:340px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
h1 { font-size:20px; margin:0 0 6px; }
p { margin:0 0 20px; color:var(--muted); font-size:14px; line-height:1.5; }
input { width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; }
input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
button { margin-top:12px; width:100%; font:inherit; font-weight:600; font-size:15px; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
.msg { min-height:20px; margin-top:10px; font-size:13px; color:var(--err); }
</style>
</head>

</form>

const KEY = "solids-pw:" + SALT; // 비밀번호가 바뀌면(새로 잠그면) 저장된 값도 무효가 됨
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(DATA));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById('f'), pwEl = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = pwEl.value.trim(); if (!pw) return;
  go.disabled = true; msg.textContent = '';
  try {
    const html = await unlock(pw);
    try { localStorage.setItem(KEY, pw); } catch (_) {}
    show(html);
  } catch (_) { msg.textContent = '비밀번호가 맞지 않아요.'; go.disabled = false; pwEl.select(); }
});
(async () => { // 이 기기에서 한 번 맞혔으면 다시 묻지 않음
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (saved) { try { show(await unlock(saved)); } catch (_) { try { localStorage.removeItem(KEY); } catch (_) {} } }
})();
</script>
